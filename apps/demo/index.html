<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notes demo</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; --line: #8884; --accent: #3b6fd8; --danger: #c0392b; }
    body { margin: 0; }
    nav { display: flex; flex-wrap: wrap; gap: .25rem 1rem; align-items: center; padding: .6rem 1rem; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: Canvas; z-index: 1; }
    nav a { text-decoration: none; color: inherit; padding: .2rem 0; border-bottom: 2px solid transparent; }
    nav a.active { border-bottom-color: var(--accent); }
    nav .brand { font-weight: 700; margin-right: .5rem; }
    nav .spacer { flex: 1; }
    main { max-width: 52rem; margin: 1.5rem auto; padding: 0 1rem; }
    #flash { max-width: 52rem; margin: .75rem auto 0; padding: 0 1rem; min-height: 1.4rem; }
    #flash.error { color: var(--danger); }
    .card { border: 1px solid var(--line); border-radius: .5rem; padding: .75rem 1rem; margin: 1rem 0; }
    .card h2 { margin: 0 0 .5rem; font-size: 1.1rem; }
    h3 { margin: 1rem 0 .4rem; font-size: 1rem; }
    form { display: grid; gap: .5rem; margin: .5rem 0; }
    form.row, .row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
    input, textarea, select, button, a.button { font: inherit; padding: .4rem .6rem; }
    textarea { min-height: 5rem; }
    button, a.button { cursor: pointer; border: 1px solid var(--line); border-radius: .35rem; background: transparent; color: inherit; text-decoration: none; }
    button.danger { color: var(--danger); border-color: var(--danger); }
    .list { list-style: none; padding: 0; margin: 0; }
    .list li { padding: .5rem 0; border-bottom: 1px solid var(--line); }
    .list li:last-child { border-bottom: 0; }
    .list li button { font-size: .8rem; padding: .15rem .5rem; margin-left: .3rem; }
    .muted { opacity: .7; font-size: .9rem; }
    .tag { font-size: .7rem; border: 1px solid var(--line); border-radius: .3rem; padding: 0 .35rem; margin-left: .4rem; }
    .body { white-space: pre-wrap; }
    table { border-collapse: collapse; width: 100%; }
    td { padding: .4rem .3rem; border-bottom: 1px solid var(--line); }
    td button { font-size: .8rem; padding: .15rem .5rem; margin-right: .3rem; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <nav id="nav"></nav>
  <p id="flash" role="status"></p>
  <main id="main"></main>
  <script type="module" src="/src/web/main.js"></script>
</body>
</html>
