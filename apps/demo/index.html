<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notes</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
    form { display: grid; gap: .5rem; margin-bottom: 1rem; }
    input, textarea, button { font: inherit; padding: .4rem; }
    textarea { min-height: 3rem; }
    header { display: flex; justify-content: space-between; align-items: baseline; }
    ul { list-style: none; padding: 0; }
    li { border-bottom: 1px solid #8884; padding: .75rem 0; white-space: pre-wrap; }
    time { display: block; font-size: .8rem; opacity: .7; }
    #message { min-height: 1.5rem; }
    [hidden] { display: none !important; }
    .actions { display: flex; gap: .5rem; margin-top: .4rem; }
    .actions button { font-size: .8rem; padding: .2rem .5rem; }
    #opened { border: 1px solid #8886; border-radius: .4rem; padding: .75rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <header><h1>Notes</h1><span id="who"></span></header>
  <p id="message" role="status"></p>
  <section id="opened" hidden>
    <p id="opened-meta"></p>
    <form id="edit-opened">
      <textarea name="body" required maxlength="10000"></textarea>
      <button>Save</button>
    </form>
    <p id="opened-body"></p>
  </section>

  <section id="signed-out" hidden>
    <p><a href="/login">Sign in</a> or <a href="/signup">create an account</a> to keep notes.</p>
  </section>

  <section id="signed-in" hidden>
    <form id="new">
      <textarea name="body" placeholder="Write a note" required maxlength="10000"></textarea>
      <label>Attach a file (up to 10 MB) <input name="file" type="file"></label>
      <button>Add</button>
    </form>
    <ul id="notes"></ul>

    <h2>Shared with me</h2>
    <ul id="shared"></ul>

    <h2>Organizations</h2>
    <form id="new-org">
      <input name="name" placeholder="New organization name" required maxlength="60">
      <button>Create organization</button>
    </form>
    <ul id="org-list"></ul>
    <div id="org" hidden>
      <h3 id="org-name"></h3>
      <p id="here"></p>
      <form id="invite">
        <input name="email" type="email" placeholder="Invite someone by email (admins only)" required>
        <button>Invite</button>
      </form>
      <form id="new-org-note">
        <textarea name="body" placeholder="Write a note for the organization" required maxlength="10000"></textarea>
        <button>Add</button>
      </form>
      <p id="typing"></p>
      <ul id="org-notes"></ul>
    </div>
  </section>

  <script type="module">
    import { live } from "@celsoft/platform/live";
    // Typed calls to the Worker's endpoints, generated by the platform from src/worker.ts.
    import { call } from "./.platform/client";

    const $ = (id) => document.getElementById(id);
    const say = (text) => ($("message").textContent = text);
    const show = (id) => ["signed-out", "signed-in"].forEach((s) => ($(s).hidden = s !== id));

    async function request(path, body) {
      const response = await fetch(path, body ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) } : {});
      const data = await response.json().catch(() => null);
      if (!response.ok) throw new Error(data?.message ?? data?.error ?? `request failed (${response.status})`);
      return data;
    }

    $("new").addEventListener("submit", async (event) => {
      event.preventDefault();
      const response = await fetch("/api/notes", { method: "POST", body: new FormData($("new")) });
      if (!response.ok) return say((await response.json().catch(() => null))?.error ?? "could not save the note");
      $("new").reset();
      say("");
      await loadNotes();
    });

    async function loadNotes() {
      const notes = await request("/api/notes");
      $("notes").replaceChildren(...notes.map((note) => {
        const li = document.createElement("li");
        const time = document.createElement("time");
        time.textContent = new Date(note.createdAt).toLocaleString();
        li.append(note.body);
        if (note.attachmentName) {
          const link = document.createElement("a");
          link.href = `/api/notes/${note.id}/attachment`;
          link.textContent = `Attachment: ${note.attachmentName}`;
          link.style.display = "block";
          li.append(link);
        }
        li.append(time, noteActions(note));
        return li;
      }));
      const shared = await call("sharedNotes", {});
      $("shared").replaceChildren(...shared.map((note) => {
        const li = document.createElement("li");
        const open = document.createElement("a");
        open.href = `#note=${note.id}`;
        open.textContent = note.body;
        const meta = document.createElement("time");
        meta.textContent = `${note.author}, ${new Date(note.createdAt).toLocaleString()}`;
        li.append(open, meta);
        return li;
      }));
    }

    // Sharing a note with someone by email, or making a link anyone holding it can open.
    function noteActions(note) {
      const actions = document.createElement("div");
      actions.className = "actions";
      const share = document.createElement("button");
      share.textContent = "Share";
      share.onclick = async () => {
        const email = prompt("Share with which email address?");
        if (!email) return;
        const level = confirm("Let them edit it? Cancel shares it read-only.") ? "write" : "read";
        try {
          await call("shareNote", { id: note.id, email, level });
          say(`Shared with ${email}; they can open it once they sign in with a confirmed address.`);
        } catch (error) { say(error.message); }
      };
      const link = document.createElement("button");
      link.textContent = "Copy link";
      link.onclick = async () => {
        const level = confirm("Let link holders edit it? Cancel makes a read-only link.") ? "write" : "read";
        try {
          const { path } = await call("linkNote", { id: note.id, level });
          const url = new URL(path, location.origin).toString();
          await navigator.clipboard?.writeText(url).catch(() => {});
          say(`Link: ${url}`);
        } catch (error) { say(error.message); }
      };
      actions.append(share, link);
      return actions;
    }

    // A note opened from an address such as /#note=<id>&link=<token>; the generated client sends the
    // link token with every call, so this works signed out too.
    async function openFromAddress() {
      const id = new URLSearchParams(location.hash.slice(1)).get("note");
      $("opened").hidden = !id;
      if (!id) return;
      try {
        const note = await call("getNote", { id });
        const editable = ["write", "delete", "manage"].includes(note.level);
        $("opened-meta").textContent = `${note.author}'s note, ${new Date(note.createdAt).toLocaleString()} (you can ${editable ? "edit" : "read"} it)`;
        $("edit-opened").hidden = !editable;
        $("opened-body").hidden = editable;
        $("edit-opened").body.value = note.body;
        $("opened-body").textContent = note.body;
      } catch {
        $("opened-meta").textContent = "This note does not exist or is not shared with you.";
        $("edit-opened").hidden = $("opened-body").hidden = true;
      }
    }

    $("edit-opened").addEventListener("submit", async (event) => {
      event.preventDefault();
      const id = new URLSearchParams(location.hash.slice(1)).get("note");
      try {
        await call("editNote", { id, body: $("edit-opened").body.value });
        say("Saved.");
      } catch (error) { say(error.message); }
    });

    addEventListener("hashchange", openFromAddress);

    // Organization notes: saved through the API, announced to the organization's room, with who is here and who is typing.
    let room;
    let org;
    let typingTimer;
    let lastTyping = 0;

    function orgNote(note) {
      const li = document.createElement("li");
      const meta = document.createElement("time");
      meta.textContent = `${note.author}, ${new Date(note.createdAt).toLocaleString()}`;
      li.append(note.body, meta);
      return li;
    }

    async function loadOrgNotes() {
      const list = await call("listOrganizationNotes", { organization: org.id });
      $("org-notes").replaceChildren(...list.map(orgNote));
    }

    async function loadOrgs() {
      const orgs = await call("listMyOrganizations", {});
      $("org-list").replaceChildren(...orgs.map((o) => {
        const li = document.createElement("li");
        const open = document.createElement("button");
        open.textContent = o.name;
        open.onclick = () => openOrg(o);
        li.append(open);
        return li;
      }));
    }

    async function openOrg(next) {
      room?.close();
      org = next;
      $("org").hidden = false;
      $("org-name").textContent = org.name;
      $("here").textContent = "";
      await loadOrgNotes();
      room = live(`organization:${org.id}`, {
        onMessage(data, { from }) {
          if (data.type === "note") $("org-notes").prepend(orgNote(data.note));
          if (data.type === "typing" && from) {
            $("typing").textContent = `${from.name} is typing`;
            clearTimeout(typingTimer);
            typingTimer = setTimeout(() => ($("typing").textContent = ""), 3000);
          }
        },
        onPresence(people, anonymous) {
          $("here").textContent = `Here now: ${people.map((p) => p.name).join(", ")}`;
        },
        onReload: loadOrgNotes,
      });
    }

    $("new-org").addEventListener("submit", async (event) => {
      event.preventDefault();
      const name = new FormData($("new-org")).get("name").trim();
      try {
        await call("createOrganization", { name });
        $("new-org").reset();
        await loadOrgs();
      } catch (error) { say(error.message); }
    });

    $("invite").addEventListener("submit", async (event) => {
      event.preventDefault();
      const email = new FormData($("invite")).get("email");
      try {
        await request(`/api/platform/organizations/${org.id}/invitations`, { email });
        $("invite").reset();
        say(`Invited ${email}; they get an email with a link to join.`);
      } catch (error) { say(error.message); }
    });

    $("new-org-note").addEventListener("submit", async (event) => {
      event.preventDefault();
      const body = new FormData($("new-org-note")).get("body");
      try {
        const note = await call("addOrganizationNote", { organization: org.id, body });
        $("org-notes").prepend(orgNote(note));
        $("new-org-note").reset();
      } catch (error) { say(error.message); }
    });

    $("new-org-note").body.addEventListener("input", () => {
      if (Date.now() - lastTyping < 2000) return;
      lastTyping = Date.now();
      room?.send({ type: "typing" });
    });

    async function start() {
      await openFromAddress();
      const session = await request("/api/auth/get-session");
      if (!session) {
        $("who").replaceChildren();
        return show("signed-out");
      }
      const out = document.createElement("button");
      out.textContent = "Sign out";
      out.onclick = async () => { await request("/api/auth/sign-out", {}); say(""); start(); };
      $("who").replaceChildren(`${session.user.email} `, out);
      show("signed-in");
      await loadNotes();
      await loadOrgs();
    }

    start().catch((error) => say(error.message));
  </script>
</body>
</html>
